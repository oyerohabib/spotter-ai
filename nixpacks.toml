[phases.setup]
nixPkgs = ["python310", "nodejs_20"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r backend/requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  ". /opt/venv/bin/activate && cd backend && python manage.py collectstatic --noinput",
]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
